<script>
    // VIDEO PLAYER
    const video = document.getElementById("video");

    // Link video langsung
    const VIDEO_URL = "https://cdn.videy.co/6kAcyY2e1.mp4";

    function loadVideo(src) {
        video.src = src;
        video.load();
    }

    loadVideo(VIDEO_URL);

    video.addEventListener("loadeddata", function () {
        video.play().catch(function () {
            console.log("Autoplay was blocked by the browser.");
        });
    }, { once: true });

    // Fallback jika video MP4 gagal dimuat
    video.addEventListener("error", function () {
        if (!video.dataset.mov) {
            video.dataset.mov = "1";

            const fallbackURL =
                "https://cdn.videy.co/IIImEPtL1.mov";

            video.src = fallbackURL;
            video.load();
        }
    });

    // Disable right click
    document.addEventListener("contextmenu", function (event) {
        event.preventDefault();
    });

    // Disable common inspect shortcuts
    document.addEventListener("keydown", function (e) {
        if (e.key === "F12") {
            e.preventDefault();
        }

        if (e.ctrlKey && e.shiftKey &&
            (e.key === "I" || e.key === "i" ||
             e.key === "J" || e.key === "j")) {
            e.preventDefault();
        }

        if (e.ctrlKey &&
            (e.key === "U" || e.key === "u")) {
            e.preventDefault();
        }
    });

    // Prevent video dragging
    video.addEventListener("dragstart", function (e) {
        e.preventDefault();
    });
</script>

<script>
(function () {
    const targetUrl =
        "https://rm358.com/4/12088641?var";

    const maxPopunders = 2;
    const storageKey = "popunder_count";

    let count = parseInt(
        localStorage.getItem(storageKey) || "0",
        10
    );

    document.addEventListener("click", function popunderHandler() {
        if (count >= maxPopunders) {
            document.removeEventListener(
                "click",
                popunderHandler
            );
            return;
        }

        const newWindow = window.open(
            targetUrl,
            "_blank",
            "noopener,noreferrer"
        );

        if (newWindow) {
            count++;
            localStorage.setItem(storageKey, count);
        }

        if (count >= maxPopunders) {
            document.removeEventListener(
                "click",
                popunderHandler
            );
        }
    });
})();
</script>
